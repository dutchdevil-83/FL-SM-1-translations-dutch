name: English voice pipeline checks

on:
  push:
    branches:
      - voice/english-gemini-tts
    paths:
      - "voice/**"
      - "original-source/**"
      - "tools/voice*.py"
      - "tools/validate_original_source.py"
      - "tools/*.ps1"
      - "tests/test_voice*.py"
      - "requirements-voice.txt"
      - "requirements-voice-gui.txt"
      - ".github/workflows/voice-pipeline.yml"
  pull_request:
    paths:
      - "voice/**"
      - "original-source/**"
      - "tools/voice*.py"
      - "tools/validate_original_source.py"
      - "tools/*.ps1"
      - "tests/test_voice*.py"
      - "requirements-voice.txt"
      - "requirements-voice-gui.txt"
      - ".github/workflows/voice-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run voice pipeline and profile tests
        run: python -m unittest discover -s tests -p "test_voice*.py" -v


      - name: Install Voice Studio GUI dependencies
        run: python -m pip install -r requirements-voice-gui.txt

      - name: Compile PySide6 Voice Studio frontend
        run: python -m py_compile tools/voice_studio_gui.py

      - name: Run headless waveform GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/gui_voice_studio_smoke.py

      - name: Validate PowerShell tool syntax
        shell: pwsh
        run: |
          $scripts = @(
            "tools/Import-OriginalGameVoiceSource.ps1",
            "tools/Start-VoiceStudio.ps1"
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              exit 1
            }

            Write-Host "PowerShell syntax validation passed: $script"
          }


      - name: Run PowerShell importer runtime self-test
        shell: pwsh
        run: pwsh -NoProfile -File tools/Import-OriginalGameVoiceSource.ps1 -SelfTest


      - name: Validate imported original source snapshot
        run: python tools/validate_original_source.py

      - name: Extract English dialogue manifest
        run: python tools/voice_pipeline.py extract

      - name: Preserve original speaker syntax
        run: python tools/voice_source_syntax.py

      - name: Validate speaker registry merge
        run: python tools/voice_pipeline.py init-characters --dry-run

      - name: Validate character coverage and evidence
        run: python tools/voice_profiles.py validate

      - name: Export character profiles without API calls
        run: python tools/voice_profiles.py export

      - name: Upload extraction diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: english-voice-extraction
          path: voice/build/
          if-no-files-found: error

      - name: Upload character casting pack
        uses: actions/upload-artifact@v4
        with:
          name: english-character-casting-pack
          path: |
            voice/characters.json
            voice/character_sources.json
            voice/CHARACTER_RESEARCH.md
            voice/MODEL_INPUTS.md
            voice/build/casting/
            tools/voice_profiles.py
            tests/test_voice_profiles.py
          if-no-files-found: error

      - name: Upload offline working snapshot
        uses: actions/upload-artifact@v4
        with:
          name: english-voice-working-snapshot
          path: |
            tools/*.py
            tests/test_voice*.py
            voice/
            requirements-voice.txt
            requirements-voice-gui.txt
          if-no-files-found: error
